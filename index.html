let cart = [];
let currentCategory = 'all';
let searchKeyword = '';

const productsGrid = document.getElementById('productsGrid');
const categoryBtns = document.querySelectorAll('.category-btn');
const searchInput = document.getElementById('searchInput');
const cartIcon = document.getElementById('cartIcon');
const cartModal = document.getElementById('cartModal');
const closeCart = document.getElementById('closeCart');
const cartItems = document.getElementById('cartItems');
const emptyCart = document.getElementById('emptyCart');
const cartSummary = document.getElementById('cartSummary');
const cartCount = document.getElementById('cartCount');
const modalTotal = document.getElementById('modalTotal');
const waOrderBtn = document.getElementById('waOrderBtn');

function formatRupiah(angka) {
    return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function renderProducts() {
    let filtered = products;
    if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
    }
    if (searchKeyword !== '') {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchKeyword.toLowerCase()));
    }
    
    productsGrid.innerHTML = filtered.map(p => `
        <div class="product-card">
            <img src="${p.image}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/160x140/fff3e0/d84315?text=${encodeURIComponent(p.name.substring(0,8))}'">
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price-option"><span>250g</span><span>${formatRupiah(p.price250)}</span></div>
                <div class="price-option"><span>500g</span><span>${formatRupiah(p.price500)}</span></div>
                <div class="price-option"><span>1000g</span><span>${formatRupiah(p.price1000)}</span></div>
                <button class="add-cart-btn" onclick="openWeightModal(${p.id})">➕ Masukkan Keranjang</button>
            </div>
        </div>
    `).join('');
}

window.openWeightModal = function(productId) {
    const product = products.find(p => p.id === productId);
    const weight = prompt(`Pilih berat:\n1 = 250g — ${formatRupiah(product.price250)}\n2 = 500g — ${formatRupiah(product.price500)}\n3 = 1000g — ${formatRupiah(product.price1000)}\n\nKetik angka 1, 2, atau 3`);
    
    let price, label;
    if (weight === '1') { price = product.price250; label = '250g'; }
    else if (weight === '2') { price = product.price500; label = '500g'; }
    else if (weight === '3') { price = product.price1000; label = '1000g'; }
    else return;
    
    cart.push({ id: Date.now(), name: product.name, weight: label, price: price });
    updateCart();
};

function updateCart() {
    cartCount.textContent = cart.length;
    
    if (cart.length === 0) {
        emptyCart.classList.remove('hidden');
        cartSummary.classList.add('hidden');
        cartItems.innerHTML = '';
        return;
    }
    
    emptyCart.classList.add('hidden');
    cartSummary.classList.remove('hidden');
    
    cartItems.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
            <div>
                <div><strong>${item.name}</strong></div>
                <div style="font-size:12px; color:#666;">${item.weight} — ${formatRupiah(item.price)}</div>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
        </div>
    `).join('');
    
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    modalTotal.textContent = formatRupiah(total);
}

window.removeFromCart = function(index) {
    cart.splice(index, 1);
    updateCart();
};

categoryBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        categoryBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderProducts();
    });
});

searchInput.addEventListener('input', (e) => {
    searchKeyword = e.target.value;
    renderProducts();
});

cartIcon.addEventListener('click', () => {
    cartModal.classList.add('show');
});

closeCart.addEventListener('click', () => {
    cartModal.classList.remove('show');
});
