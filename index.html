 iveCategory = 'all';

        // ========== FORMAT RUPIAH ==========
        function formatRupiah(angka) {
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        // ========== RENDER PRODUK ==========
        function renderProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            
            let filtered = products;
            if (activeCategory !== 'all') {
                filtered = products.filter(p => p.category === activeCategory);
            }

            // Filter pencarian
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm));
            }

            // Kelompokkan per kategori
            const categories = {
                cemilan: { title: '📦 CEMILAN', items: filtered.filter(p => p.category === 'cemilan') },
                permen: { title: '🍬 PERMEN & COKLAT', items: filtered.filter(p => p.category === 'permen') },
                kue: { title: '🧁 KUE KERING', items: filtered.filter(p => p.category === 'kue') },
                oleh: { title: '🎁 OLEH-OLEH BANDUNG', items: filtered.filter(p => p.category === 'oleh') }
            };

            Object.entries(categories).forEach(([key, cat]) => {
                if (cat.items.length > 0) {
                    container.innerHTML += `<h2 class="section-title">${cat.title}</h2>`;
                    container.innerHTML += `<div class="product-grid" id="grid-${key}"></div>`;
                    const grid = document.getElementById(`grid-${key}`);
                    cat.items.forEach(product => {
                        const priceOptions = product.prices.map((p, i) => 
                            `<option value="${i}">${p.weight} — ${formatRupiah(p.price)}</option>`
                        ).join('');

                        grid.innerHTML += `
                            <div class="product-card" data-name="${product.name.toLowerCase()}">
                                <img src="${product.image}" alt="${product.name}" class="product-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div class="product-img" style="display:none;">Foto</div>
                                <div class="product-info">
                                    <div class="product-name">${product.name}</div>
                                    <select class="weight-select" id="sel-${product.id}">
                                        ${priceOptions}
                                    </select>
                                    <button class="add-cart-btn" data-id="${product.id}">+ Keranjang</button>
                                </div>
                            </div>
                        `;
                    });
                }
            });

            // Pasang event listener tombol tambah keranjang
            document.querySelectorAll('.add-cart-btn').forEach(btn => {
                btn.addEventListener('click', addToCart);
            });
        }

        // ========== KERANJANG FUNGSI ==========
        function addToCart(e) {
            const id = parseInt(e.target.dataset.id);
            const product = products.find(p => p.id === id);
            const select = document.getElementById(`sel-${id}`);
            const priceIndex = parseInt(select.value);
            const selectedPrice = product.prices[priceIndex];

            const existingIndex = cart.findIndex(item => 
                item.id === id && item.weight === selectedPrice.weight
            );

            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    weight: selectedPrice.weight,
                    price: selectedPrice.price,
                    qty: 1
                });
            }
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            document.getElementById('cartCount').textContent = totalItems;
            document.getElementById('cartTotal').textContent = formatRupiah(totalPrice);
            
            renderCartModal();
        }

        function renderCartModal() {
            const container = document.getElementById('cartItems');
            const emptyMsg = document.getElementById('emptyCartMsg');
            const summary = document.getElementById('cartSummary');
            
            if (cart.length === 0) {
                container.innerHTML = '';
                emptyMsg.classList.remove('hidden');
                summary.classList.add('hidden');
                return;
            }

            emptyMsg.classList.add('hidden');
            summary.classList.remove('hidden');
            
            container.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div>
                        <div style="font-weight:600; font-size:14px;">${item.name}</div>
                        <div style="font-size:12px; color:#888;">${item.weight} • ${formatRupiah(item.price)}</div>
                    </div>
                    <div class="item-qty">
                        <button class="qty-btn" data-action="minus" data-index="${index}">−</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" data-action="plus" data-index="${index}">+</button>
                    </div>
                </div>
            `).join('');

            const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('modalTotal').textContent = formatRupiah(grandTotal);

            // Event qty buttons
            document.querySelectorAll('.qty-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const action = e.target.dataset.action;
                    const idx = parseInt(e.target.dataset.index);
                    if (action === 'plus') {
                        cart[idx].qty += 1;
                    } else {
                        cart[idx].qty -= 1;
                        if (cart[idx].qty <= 0) cart.splice(idx, 1);
                    }
                    updateCartDisplay();
                });
            });
        }

        // ========== KIRIM KE WHATSAPP ==========
        function sendToWhatsApp() {
            if (cart.length === 0) return;
            
            let message = "🛒 *PESANAN YANIKA SNACK*\n\n";
            let total = 0;
            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                message += `✅ ${item.name} (${item.weight}) × ${item.qty} = ${formatRupiah(subtotal)}\n`;
            });
            message += `\n💰 *TOTAL: ${formatRupiah(total)}*\n\n`;
            message += "Silakan konfirmasi pesanan Anda. Terima kasih! 😊";
            
            const waNumber = "6285721349673";
            const url = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // ========== EVENT LISTENER ==========
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();

            // Kategori klik
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeCategory = btn.dataset.category;
                    renderProducts();
                });
            });

            // Pencarian
            document.getElementById('searchInput').addEventListener('input', renderProducts);

            // Modal keranjang
            document.getElementById('openCart').addEventListener('click', () => {
                document.getElementById('cartModal').style.display = 'flex';
                renderCartModal();
            });
            document.getElementById('closeCart').addEventListener('click', () => {
                document.getElementById('cartModal').style.display = 'none';
            });
            document.getElementById('cartModal').addEventListener('click', (e) => {
                if (e.target.id === 'cartModal') {
                    document.getElementById('cartModal').style.display = 'none';
                }
            });

            // Kirim ke WA
            document.getElementById('sendToWA').addEventListener('click', sendToWhatsApp);
        });
    </script>
