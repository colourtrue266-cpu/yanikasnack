<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanika Snack - Cemilan & Oleh-Oleh Khas Bandung</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: #fff8e1; min-height: 100vh; padding-bottom: 90px; }
        header { background: #d84315; color: white; padding: 20px; text-align: center; }
        header h1 { font-size: 22px; margin-bottom: 5px; }
        header p { font-size: 14px; opacity: 0.9; }

        .search-box { padding: 12px 15px; background: white; position: sticky; top: 0; z-index: 99; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .search-box input { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 25px; font-size: 15px; outline: none; }

        .category-menu { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 15px; background: #fff3e0; }
        .category-btn { padding: 8px 16px; background: white; border: 2px solid #d84315; color: #d84315; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .category-btn.active, .category-btn:hover { background: #d84315; color: white; }

        .products-container { padding: 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 6px rgba(0,0,0,0.08); }
        .product-img { width: 100%; height: 140px; object-fit: cover; background: #f5f5f5; }
        .product-info { padding: 10px; }
        .product-name { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #333; }
        .price-option { font-size: 12px; color: #666; margin: 4px 0; display: flex; justify-content: space-between; }
        .add-cart-btn { width: 100%; padding: 8px; margin-top: 8px; background: #4caf50; color: white; border: none; border-radius: 5px; font-size: 13px; cursor: pointer; }
        .add-cart-btn:hover { background: #43a047; }

        .cart-icon { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #d84315; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 26px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; z-index: 100; }
        .cart-count { position: absolute; top: -5px; right: -5px; background: #e53935; color: white; font-size: 12px; font-weight: bold; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .cart-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 200; overflow-y: auto; }
        .cart-modal.show { display: flex; align-items: center; justify-content: center; }
        .cart-content { background: white; width: 90%; max-width: 420px; border-radius: 12px; padding: 20px; margin: 20px; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { font-size: 24px; cursor: pointer; color: #888; }
        .cart-item { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .remove-btn { background: #e53935; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .cart-total { margin-top: 15px; font-size: 18px; font-weight: bold; text-align: right; }
        .wa-order-btn { width: 100%; padding: 12px; margin-top: 15px; background: #25d366; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .empty-cart { text-align: center; padding: 30px; color: #888; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <h1>🏪 Yanika Snack</h1>
    <p>Cemilan & Oleh-Oleh Khas Bandung — Hubungi: 085721349673</p>
</header>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Cari produk...">
</div>

<div class="category-menu">
    <button class="category-btn active" data-category="all">Semua</button>
    <button class="category-btn" data-category="oleh">Oleh-Oleh Bandung</button>
    <button class="category-btn" data-category="kue">Kue Kering</button>
    <button class="category-btn" data-category="permen">Permen & Coklat</button>
    <button class="category-btn" data-category="cemilan">Cemilan</button>
</div>

<div class="products-container">
    <div class="products-grid" id="productsGrid"></div>
</div>

<div class="cart-icon" id="cartIcon">
    🛒 <span class="cart-count" id="cartCount">0</span>
</div>

<div class="cart-modal" id="cartModal">
    <div class="cart-content">
        <div class="cart-header">
            <h3>Keranjang Belanja</h3>
            <span class="close-btn" id="closeCart">&times;</span>
        </div>
        <div id="cartItems"></div>
        <div class="empty-cart" id="emptyCart">Keranjang masih kosong</div>
        <div id="cartSummary" class="hidden">
            <div class="cart-total">Total: <span id="modalTotal">Rp 0</span></div>
            <button class="wa-order-btn" id="waOrderBtn">📲 Pesan via WhatsApp</button>
        </div>
    </div>
</div>

<script>

  // === OLEH-OLEH BANDUNG ===

  { id:8, name:"Keripik Tempe Sagu", category:"oleh", price250:14000, price500:27000, price1000:54000, image:"keripik-tempe-sagu.jpg" },
  { id:9, name:"Sale Lidah", category:"oleh", price250:14000, price500:27000, price1000:54000, image:"sale-lidah.jpg" },
  { id:10, name:"Sale Jari", category:"oleh", price250:14000, price500:27000, price1000:54000, image:"sale-jari.jpg" },
  { id:11, name:"Gurilem Cililin Pedas", category:"oleh", price250:15000, price500:29000, price1000:58000, image:"gurilem-cililin-pedas.jpg" },
  { id:12, name:"Gurilem Cililin Bumbu Kacang", category:"oleh", price250:15000, price500:29000, price1000:58000, image:"gurilem-cililin-bumbu-kacang.jpg" },

  // === KUE KERING ===
  { id:13, name:"Bagelen Mini Butter", category:"kue", price250:17000, price500:33000, price1000:66000, image:"bagelen-mini-butter.jpg" },
  { id:14, name:"Bagelen Butter", category:"kue", price250:22500, price500:48000, price1000:96000, image:"bagelen-butter.jpg" },
  { id:15, name:"Bagelen Keju", category:"kue", price250:25000, price500:49000, price1000:98000, image:"bagelen-keju.jpg" },
  { id:16, name:"Bolu Kering", category:"kue", price250:15000, price500:29000, price1000:58000, image:"bolu-kering.jpg" },
  { id:17, name:"Bolu Eggmoon", category:"kue", price250:15000, price500:29000, price1000:58000, image:"bolu-eggmoon.jpg" },
  { id:18, name:"Kue Semprit", category:"kue", price250:15000, price500:29000, price1000:58000, image:"kue-semprit.jpg" },
  { id:19, name:"Sagu Keju Special", category:"kue", price250:22000, price500:43000, price1000:86000, image:"sagu-keju-special.jpg" },

  // === PERMEN & COKLAT ===
  { id:23, name:"Permen Jahe", category:"permen", price250:12000, price500:23000, price1000:46000, image:"permen-jahe.jpg" },
  { id:24, name:"Permen Asem", category:"permen", price250:12000, price500:23000, price1000:46000, image:"permen-asem.jpg" },
  { id:25, name:"Kue Balut Coklat", category:"permen", price250:20000, price500:39000, price1000:78000, image:"kue-balut-coklat.jpg" },

  // === CEMILAN ===
  { id:29, name:"Keripik Sukun", category:"cemilan", price250:17000, price500:33000, price1000:66000, image:"keripik-sukun.jpg" },
  { id:30, name:"Kerupuk Jengkol", category:"cemilan", price250:14000, price500:27000, price1000:54000, image:"kerupuk-jengkol.jpg" },
  { id:31, name:"Telor Gabus Keju Special", category:"cemilan", price250:22000, price500:43000, price1000:86000, image:"telor-gabus-keju-special.jpg" },
  { id:32, name:"Sumpia Udang", category:"cemilan", price250:12000, price500:23000, price1000:46000, image:"sumpia-udang.jpg" },
  { id:33, name:"Liliput Wijen Special", category:"cemilan", price250:20000, price500:39000, price1000:78000, image:"liliput-wijen-special.jpg" },
  { id:34, name:"Makroni Mini Keju", category:"cemilan", price250:12000, price500:23000, price1000:46000, image:"makroni-mini-keju.jpg" },
  { id:35, name:"Makroni Mini Pedas", category:"cemilan", price250:12000, price500:23000, price1000:46000, image:"makroni-mini-pedas.jpg" },
  { id:36, name:"Makroni Mini Cikruh", category:"cemilan", price250:12000, price500:23000, price1000:46000, image:"makroni-mini-cikruh.jpg" },
  { id:37, name:"Lanting", category:"cemilan", price250:10000, price500:19000, price1000:38000, image:"lanting.jpg" },
  { id:38, name:"Pangsit Jeruk Pedas", category:"cemilan", price250:10000, price500:19000, price1000:38000, image:"pangsit-jeruk-pedas.jpg" },
  { id:39, name:"Pangsit", category:"cemilan", price250:12000, price500:23000, price1000:46000, image:"pangsit.jpg" },
  { id:40, name:"Comring", category:"cemilan", price250:12000, price500:23000, price1000:46000, image:"comring.jpg" },
  { id:41, name:"Keripik Chuba Balado", category:"cemilan", price250:20000, price500:39000, price1000:78000, image:"keripik-chuba-balado.jpg" },
  { id:42, name:"Kerupuk Chuba Keju", category:"cemilan", price250:20000, price500:39000, price1000:78000, image:"kerupuk-chuba-keju.jpg" },
  { id:43, name:"Keripik Talas Stik", category:"cemilan", price250:15000, price500:29000, price1000:58000, image:"keripik-talas-stik.jpg" },
  { id:44, name:"Keripik Pisang Gurih", category:"cemilan", price250:15000, price500:29000, price1000:58000, image:"keripik-pisang-gurih.jpg" },
  { id:45, name:"Keripik Pisang Madu", category:"cemilan", price250:15000, price500:29000, price1000:58000, image:"keripik-pisang-madu.jpg" },
  { id:46, name:"Telor Gabus Keju", category:"cemilan", price250:12500, price500:24000, price1000:48000, image:"telor-gabus-keju.jpg" },
  { id:47, name:"Keripik Singkong Pedas Jadul", category:"cemilan", price250:12500, price500:24000, price1000:48000, image:"keripik-singkong-pedas-jadul.jpg" }
];

let cart = [];
let currentCategory = 'all';
let searchKeyword = '';

const productsGrid = document.getElementById('productsGrid');
const categoryBtns = document.querySelectorAll('.category-btn');
const searchInput = document.getElementById('searchInput');
const cartIcon = document.getElementById('cartIcon');
const cartModal = document.getElementById('cartModal');
const closeCart = document.getElementById('closeCart');
const cartItems = document.getElementById('cartItems');
const emptyCart = document.getElementById('emptyCart');
const cartSummary = document.getElementById('cartSummary');
const cartCount = document.getElementById('cartCount');
const modalTotal = document.getElementById('modalTotal');
const waOrderBtn = document.getElementById('waOrderBtn');

function formatRupiah(angka) {
    return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function renderProducts() {
    let filtered = products;
    if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
    }
    if (searchKeyword !== '') {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchKeyword.toLowerCase()));
    }
    
    productsGrid.innerHTML = filtered.map(p => `
        <div class="product-card">
            <img src="${p.image}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/160x140/fff3e0/d84315?text=${encodeURIComponent(p.name.substring(0,9))}'">
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price-option"><span>250g</span><span>${formatRupiah(p.price250)}</span></div>
                <div class="price-option"><span>500g</span><span>${formatRupiah(p.price500)}</span></div>
                <div class="price-option"><span>1000g</span><span>${formatRupiah(p.price1000)}</span></div>
                <button class="add-cart-btn" onclick="openWeightModal(${p.id})">➕ Masukkan Keranjang</button>
            </div>
        </div>
    `).join('');
}

window.openWeightModal = function(productId) {
    const product = products.find(p => p.id === productId);
    const weight = prompt(`Pilih berat:\n1 = 250g — ${formatRupiah(product.price250)}\n2 = 500g — ${formatRupiah(product.price500)}\n3 = 1000g — ${formatRupiah(product.price1000)}\n\nKetik angka 1, 2, atau 3`);
    
    let price, label;
    if (weight === '1') { price = product.price250; label = '250g'; }
    else if (weight === '2') { price = product.price500; label = '500g'; }
    else if (weight === '3') { price = product.price1000; label = '1000g'; }
    else return;
    
    cart.push({ id: Date.now(), name: product.name, weight: label, price: price });
    updateCart();
};

function updateCart() {
    cartCount.textContent = cart.length;
    
    if (cart.length === 0) {
        emptyCart.classList.remove('hidden');
        cartSummary.classList.add('hidden');
        cartItems.innerHTML = '';
        return;
    }
    
    emptyCart.classList.add('hidden');
    cartSummary.classList.remove('hidden');
    
    cartItems.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
            <div>
                <div><strong>${item.name}</strong></div>
                <div style="font-size:12px; color:#666;">${item.weight} — ${formatRupiah(item.price)}</div>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
        </div>
    `).join('');
    
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    modalTotal.textContent = formatRupiah(total);
}

window.removeFromCart = function(index) {
    cart.splice(index, 1);
    updateCart();
};

categoryBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        categoryBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderProducts();
    });
});

searchInput.addEventListener('input', (e) => {
    searchKeyword = e.target.value;
    renderProducts();
});

cartIcon.addEventListener('click', () => {
    cartModal.classList.add('show');
});

closeCart.addEventListener('click', () => {
    cartModal.classList.remove('show');
});

waOrderBtn.addEventListener('click', () => {
    if (cart.length === 0) return;
    
    let message = 'PESANAN YANIKA SNACK:\n\n';
    cart.forEach(item => {
        message += `✅ ${item.name} (${item.weight}) — ${formatRupiah(item.price)}\n`;
    });
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    message += `\n💰 TOTAL: ${formatRupiah(total)}`;
    message += '\n\nSilakan konfirmasi pesanan Anda 🙏';
    
    const url = `https://wa.me/6285721349673?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
    
    cart = [];
    updateCart();
    cartModal.classList.remove('show');
});

renderProducts();
</script>

</body>
</html>
