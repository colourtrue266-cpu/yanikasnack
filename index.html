        header h1 { font-size: 28px; }
        header p { margin-top: 5px; opacity: 0.9; }
        
        .kategori { display: flex; justify-content: center; gap: 15px; padding: 20px; background: #ffe0b2; position: sticky; top: 0; z-index: 100; }
        .tombol-kategori { padding: 12px 25px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tombol-kategori.aktif { background: #d84315; color: white; }
        .tombol-kategori:not(.aktif) { background: white; color: #d84315; border: 2px solid #d84315; }
        .tombol-kategori:hover { transform: scale(1.05); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .produk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .kartu-produk { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.3s; }
        .kartu-produk:hover { transform: translateY(-5px); }
        .foto-produk { height: 150px; background: #ffe0b2; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        .info-produk { padding: 15px; }
        .nama-produk { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .harga { color: #d84315; font-size: 17px; font-weight: bold; margin-bottom: 10px; }
        .beli { display: block; width: 100%; background: #25d366; color: white; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .beli:hover { background: #128c7e; }
        
        .kategori-bagian { display: none; }
        .kategori-bagian.tampil { display: block; }
        
        .kontak { text-align: center; padding: 30px; background: #d84315; color: white; margin-top: 40px; }
    </style>
</head>
